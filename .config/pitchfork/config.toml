[daemons.cardamom]
run = 'exec card web --store "$HOME/.config/cardamom" --port=5999 --no-browser'
mise = true
boot_start = true
ready_port = 5999

[daemons."cardamom-backup"]
run = 'exec litestream replicate -log-level warn "$HOME/.config/cardamom/board.sqlite3" file://$HOME/.local/share/cardamom/replica'
mise = true
boot_start = true
