keybinding:
  # Don't quit with Ctrl-C or Q. Quit with Q only.
  universal:
    quit: Q
    quit-alt1: <disabled>
    quitWithoutChangingDirectory: <disabled>
  commits:
    moveUpCommit: <alt+k>
    moveDownCommit: <alt+j>

customCommands:
  - key: N
    context: commits
    prompts:
      - type: input
        key: BranchName
        title: "Branch name:"
    command: 'git branch -f "{{.Form.BranchName}}" "{{.SelectedLocalCommit.Hash}}"'
    description: "Upsert a branch to the selected commit"

git:
  fetchAll: false
  autoFetch: false # don't git fetch in the background
  autoRefresh: false # don't refresh file list in the background
  overrideGpg: true

  # Don't truncate copied hashes.
  truncateCopiedCommitHashesTo: 40

  ignoreWhitespaceInDiffView: true

  diffRenderers:

    # delta: inline and side by side
    - command: >-
        delta --dark --paging=never
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - command: >-
        delta --dark --paging=never --side-by-side
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

    # difft: inline and side by side
    - command: difft --color=always --display=inline
      type: extDiff
    - command: difft --color=always
      type: extDiff
os:
  editPreset: nvim

gui:
  tabWidth: 8
  sidePanelWidth: 0.2
  nerdFontsVersion: 3
  border: single
  animateExplosion: false
  filterMode: fuzzy

  skipAmendWarning: true # I know what I'm doing
  expandFocusedSidePanel: true # accordion mode
  switchTabsWithPanelJumpKeys: true

disableStartupPopups: true
promptToReturnFromSubprocess: false
